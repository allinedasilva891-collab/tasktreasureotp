services:
  - type: web
    name: otp-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_complete_bot.py
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: PORT
        value: 8080
      - key: BOT_TOKEN
        value: 8209019507:AAEiOGk-JYChsq7iimddGvxaSZq6grEsVSs
      - key: CHANNEL_ID
        value: -1002724043027
      - key: ADMIN_USER_ID
        value: 7325836764
    scaling:
      minInstances: 1
      maxInstances: 1